<svg xmlns="http://www.w3.org/2000/svg" width="980" height="450" viewBox="0 0 980 450">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    .title { font: 700 26px Arial, sans-serif; fill: #111827; }
    .label { font: 700 16px Arial, sans-serif; fill: #111827; }
    .tick { font: 400 15px Arial, sans-serif; fill: #374151; }
    .value { font: 700 17px Arial, sans-serif; fill: #111827; }
  </style>

  <text x="490" y="44" text-anchor="middle" class="title">Single-Intersection RL Improvements Over Fixed-Time</text>

  <line x1="210" y1="80" x2="210" y2="390" stroke="#111827" stroke-width="1.4"/>
  <line x1="210" y1="390" x2="920" y2="390" stroke="#111827" stroke-width="1.4"/>

  <line x1="210" y1="80" x2="210" y2="390" stroke="#E5E7EB"/>
  <text x="210" y="412" text-anchor="middle" class="tick">0%</text>
  <line x1="328.333" y1="80" x2="328.333" y2="390" stroke="#E5E7EB"/>
  <text x="328.333" y="412" text-anchor="middle" class="tick">10%</text>
  <line x1="446.667" y1="80" x2="446.667" y2="390" stroke="#E5E7EB"/>
  <text x="446.667" y="412" text-anchor="middle" class="tick">20%</text>
  <line x1="565" y1="80" x2="565" y2="390" stroke="#E5E7EB"/>
  <text x="565" y="412" text-anchor="middle" class="tick">30%</text>
  <line x1="683.333" y1="80" x2="683.333" y2="390" stroke="#E5E7EB"/>
  <text x="683.333" y="412" text-anchor="middle" class="tick">40%</text>
  <line x1="801.667" y1="80" x2="801.667" y2="390" stroke="#E5E7EB"/>
  <text x="801.667" y="412" text-anchor="middle" class="tick">50%</text>
  <line x1="920" y1="80" x2="920" y2="390" stroke="#E5E7EB"/>
  <text x="920" y="412" text-anchor="middle" class="tick">60%</text>

  <text x="194" y="123" text-anchor="end" class="label">Avg Queue / Step</text>
  <rect x="210" y="105" width="225.4" height="28" fill="#377684" rx="3"/>
  <text x="443.4" y="124" text-anchor="start" class="value">+19.0%</text>

  <text x="194" y="183" text-anchor="end" class="label">Avg Trip Duration</text>
  <rect x="210" y="165" width="110.4" height="28" fill="#377684" rx="3"/>
  <text x="328.4" y="184" text-anchor="start" class="value">+9.3%</text>

  <text x="194" y="243" text-anchor="end" class="label">Avg Waiting Time</text>
  <rect x="210" y="225" width="226.9" height="28" fill="#377684" rx="3"/>
  <text x="444.9" y="244" text-anchor="start" class="value">+19.2%</text>

  <text x="194" y="303" text-anchor="end" class="label">Avg Time Loss</text>
  <rect x="210" y="285" width="154.4" height="28" fill="#377684" rx="3"/>
  <text x="372.4" y="304" text-anchor="start" class="value">+13.0%</text>

  <text x="194" y="363" text-anchor="end" class="label">Max Waiting Time</text>
  <rect x="210" y="345" width="710.0" height="28" fill="#377684" rx="3"/>
  <text x="928.0" y="364" text-anchor="end" class="value">+65.5%</text>

</svg>
