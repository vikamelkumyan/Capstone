<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    .title { font: 700 22px Arial, sans-serif; fill: #111827; }
    .subtitle { font: 400 13px Arial, sans-serif; fill: #4B5563; }
    .label { font: 700 12px Arial, sans-serif; fill: #111827; }
    .tick { font: 400 11px Arial, sans-serif; fill: #4B5563; }
    .value { font: 700 12px Arial, sans-serif; fill: #111827; }
  </style>

  <text x="490" y="34" text-anchor="middle" class="title">Single-Intersection RL Change vs Fixed-Time</text>
  <text x="490" y="56" text-anchor="middle" class="subtitle">
    Komitas-Vagharshyan evening-rush evaluation. Positive values mean lower delay/queue; negative means worse.
  </text>

  <line x1="210" y1="80" x2="210" y2="430" stroke="#111827" stroke-width="1.4"/>
  <line x1="210" y1="430" x2="920" y2="430" stroke="#111827" stroke-width="1.4"/>

  <line x1="248.38" y1="80" x2="248.38" y2="430" stroke="#111827" stroke-width="1.2"/>
  <text x="248.38" y="452" text-anchor="middle" class="tick">0%</text>

  <line x1="210.00" y1="80" x2="210.00" y2="430" stroke="#E5E7EB"/>
  <text x="210.00" y="452" text-anchor="middle" class="tick">-5%</text>
  <line x1="325.14" y1="80" x2="325.14" y2="430" stroke="#E5E7EB"/>
  <text x="325.14" y="452" text-anchor="middle" class="tick">10%</text>
  <line x1="478.68" y1="80" x2="478.68" y2="430" stroke="#E5E7EB"/>
  <text x="478.68" y="452" text-anchor="middle" class="tick">30%</text>
  <line x1="632.22" y1="80" x2="632.22" y2="430" stroke="#E5E7EB"/>
  <text x="632.22" y="452" text-anchor="middle" class="tick">50%</text>
  <line x1="785.76" y1="80" x2="785.76" y2="430" stroke="#E5E7EB"/>
  <text x="785.76" y="452" text-anchor="middle" class="tick">70%</text>

  <text x="194" y="112" text-anchor="end" class="label">Steps</text>
  <rect x="218.43" y="94" width="29.95" height="28" fill="#DC2626" rx="3"/>
  <text x="210.43" y="113" text-anchor="end" class="value">-3.9%</text>

  <text x="194" y="172" text-anchor="end" class="label">Avg Queue / Step</text>
  <rect x="248.38" y="154" width="146.80" height="28" fill="#059669" rx="3"/>
  <text x="403.18" y="173" text-anchor="start" class="value">+19.1%</text>

  <text x="194" y="232" text-anchor="end" class="label">Avg Trip Duration</text>
  <rect x="248.38" y="214" width="71.68" height="28" fill="#059669" rx="3"/>
  <text x="328.06" y="233" text-anchor="start" class="value">+9.3%</text>

  <text x="194" y="292" text-anchor="end" class="label">Avg Waiting Time</text>
  <rect x="248.38" y="274" width="146.55" height="28" fill="#059669" rx="3"/>
  <text x="402.93" y="293" text-anchor="start" class="value">+19.1%</text>

  <text x="194" y="352" text-anchor="end" class="label">Avg Time Loss</text>
  <rect x="248.38" y="334" width="100.16" height="28" fill="#059669" rx="3"/>
  <text x="356.54" y="353" text-anchor="start" class="value">+13.0%</text>

  <text x="194" y="412" text-anchor="end" class="label">Max Waiting Time</text>
  <rect x="248.38" y="394" width="502.81" height="28" fill="#059669" rx="3"/>
  <text x="759.19" y="413" text-anchor="start" class="value">+65.5%</text>
</svg>
