<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <style>
    .title { font: 700 26px Arial, sans-serif; fill: #111827; }
    .label { font: 700 16px Arial, sans-serif; fill: #111827; }
    .small { font: 400 14px Arial, sans-serif; fill: #374151; }
    .tiny { font: 400 12px Arial, sans-serif; fill: #4b5563; }
    .box { stroke: #111827; stroke-width: 1.4; rx: 8; }
    .arrow { stroke: #111827; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#111827"/>
    </marker>
  </defs>

  <text x="490" y="44" text-anchor="middle" class="title">Local Double DQN Network Architecture</text>

  <!-- Input box -->
  <rect x="50" y="125" width="190" height="150" fill="#E0F2FE" class="box"/>
  <text x="145" y="152" text-anchor="middle" class="label">Input State</text>
  <text x="145" y="177" text-anchor="middle" class="small">state_dim = k + 13</text>
  <text x="145" y="204" text-anchor="middle" class="tiny">phase pressures</text>
  <text x="145" y="222" text-anchor="middle" class="tiny">elapsed green</text>
  <text x="145" y="240" text-anchor="middle" class="tiny">queue / wait / spillback</text>
  <text x="145" y="258" text-anchor="middle" class="tiny">traffic load + neighbors</text>

  <!-- Hidden 1 -->
  <rect x="310" y="120" width="150" height="160" fill="#DCFCE7" class="box"/>
  <text x="385" y="154" text-anchor="middle" class="label">Hidden Layer 1</text>
  <text x="385" y="183" text-anchor="middle" class="small">Linear</text>
  <text x="385" y="205" text-anchor="middle" class="small">128 neurons</text>
  <text x="385" y="232" text-anchor="middle" class="small">ReLU</text>

  <!-- Hidden 2 -->
  <rect x="520" y="120" width="150" height="160" fill="#DCFCE7" class="box"/>
  <text x="595" y="154" text-anchor="middle" class="label">Hidden Layer 2</text>
  <text x="595" y="183" text-anchor="middle" class="small">Linear</text>
  <text x="595" y="205" text-anchor="middle" class="small">128 neurons</text>
  <text x="595" y="232" text-anchor="middle" class="small">ReLU</text>

  <!-- Output -->
  <rect x="740" y="95" width="190" height="210" fill="#FEF3C7" class="box"/>
  <text x="835" y="124" text-anchor="middle" class="label">Output Q-values</text>
  <text x="835" y="149" text-anchor="middle" class="small">action_dim = 1 + k</text>
  <text x="835" y="180" text-anchor="middle" class="tiny">Q(s, EXTEND)</text>
  <text x="835" y="201" text-anchor="middle" class="tiny">Q(s, green phase 1)</text>
  <text x="835" y="222" text-anchor="middle" class="tiny">Q(s, green phase 2)</text>
  <text x="835" y="243" text-anchor="middle" class="tiny">...</text>
  <text x="835" y="264" text-anchor="middle" class="tiny">Q(s, green phase k)</text>
  <text x="835" y="289" text-anchor="middle" class="tiny">highest valid Q-value wins</text>

  <!-- Arrows -->
  <line x1="240" y1="200" x2="305" y2="200" class="arrow"/>
  <line x1="460" y1="200" x2="515" y2="200" class="arrow"/>
  <line x1="670" y1="200" x2="735" y2="200" class="arrow"/>

  <!-- Example -->
  <rect x="180" y="335" width="620" height="62" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.2" rx="8"/>
  <text x="490" y="360" text-anchor="middle" class="label">Example: k = 2 green phases</text>
  <text x="490" y="383" text-anchor="middle" class="small">
    state_dim = 15, action_dim = 3: EXTEND current green, select phase 1, select phase 2
  </text>
</svg>
